<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alan He</title>
  <meta name="description" content="Alan He — based in the Netherlands. Personal website with links to LinkedIn and X." />

  <!-- Open Graph -->
  <meta property="og:title" content="Alan He" />
  <meta property="og:description" content="Alan He — based in the Netherlands." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://alanheye.com" />
  <meta property="og:image" content="https://alanheye.com/avatar.jpeg" />

  <!-- X/Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Alan He" />
  <meta name="twitter:description" content="Alan He — based in the Netherlands." />
  <meta name="twitter:image" content="https://alanheye.com/avatar.jpeg" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
    }

    /* Avatar */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #666;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }

    .role {
      font-size: 1rem;
      color: #444;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    .location {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1.25rem;
    }

    .bio {
      font-size: 1rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.75; }

    .btn-linkedin { background: #0a66c2; color: #fff; }
    .btn-x       { background: #000; color: #fff; }
    .btn-email   { background: #f0f0f0; color: #111; }

    .btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Avatar: replace src with your actual photo -->
    <div class="avatar">
      <img src="avatar.jpeg" alt="Alan He" onerror="this.style.display='none'" />
      AH
    </div>

    <h1>Alan He</h1>
    <p class="role">Your Role · Company Name</p>
    <p class="location">Netherlands</p>

    <p class="bio">
      Short bio about yourself — what you do, what you care about, and what you're working on.
    </p>

    <div class="links">

      <!-- LinkedIn -->
      <a class="btn btn-linkedin" href="https://www.linkedin.com/in/alan-he-nl" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>

      <!-- X / Twitter — replace YOUR_HANDLE with your actual handle -->
      <a class="btn btn-x" href="https://x.com/YOUR_HANDLE" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.253 5.622 5.91-5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        X
      </a>

      <!-- Email -->
      <a class="btn btn-email" href="mailto:alan@alanheye.com">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Email
      </a>

    </div>
  </div>
</body>
</html>
